name: Deploy Escal (SFTP IONOS)

# Déploiement automatique à chaque push sur main (IONOS = SFTP uniquement).
# - admin-escal  → build statique  → SFTP vers ~/admin
# - modul-escal  → build statique  → SFTP vers ~/calcul
# - modul-escal  → build wc        → SFTP vers ~/wc/staging et ~/wc/<version>
# - api (PHP)    → copie directe   → SFTP vers ~/api
#
# Upload-only : les fichiers présents sur le serveur mais absents du repo
# (config.php, uploads/) ne sont JAMAIS supprimés.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-sftp
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────
  admin:
    name: Admin → /admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-escal/package-lock.json
      - name: Build admin
        working-directory: admin-escal
        run: |
          npm ci
          npm run build
      - name: Deploy admin via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          port:      22
          local_path: './admin-escal/out/*'
          remote_path: 'admin'
          sftp_only: true

  # ────────────────────────────────────────────────────────────────
  calcul:
    name: Calcul → /calcul
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modul-escal/package-lock.json
      # `npm run build` génère les WebP depuis assets-src/ avant next build :
      # sans cwebp, le build échoue.
      - name: Install cwebp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp

      - name: Build calcul
        working-directory: modul-escal
        run: |
          npm ci
          npm run build
      - name: Deploy calcul via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          port:      22
          local_path: './modul-escal/out/*'
          remote_path: 'calcul'
          sftp_only: true

  # ────────────────────────────────────────────────────────────────
  # Web Component <kre-configurateur> livré à Knewledge pour intégration
  # WordPress. Deux cibles depuis le même code :
  #   /wc/staging/  → recette, republié à chaque push (cache court)
  #   /wc/<version> → immuable, cache 1 an ; ne bouge que si WC_VERSION change
  #
  # Chaque dossier est autonome (bundle + images WebP + police + .htaccess) car
  # le composant résout ses assets relativement à l'URL de son script.
  wc:
    name: Web Component → /wc
    runs-on: ubuntu-latest
    env:
      # Bump manuel à chaque livraison. Un dossier déjà publié ne doit JAMAIS
      # être écrasé : les pages WordPress pointent une URL versionnée figée.
      WC_VERSION: v1.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modul-escal/package-lock.json

      - name: Install cwebp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp

      - name: Install deps
        working-directory: modul-escal
        run: npm ci

      - name: Build staging + version
        working-directory: modul-escal
        run: |
          npm run package:wc -- staging \
            --base https://escal.point-soft.fr/wc/staging
          npm run package:wc -- "$WC_VERSION"

      # L'action SFTP crée les sous-dossiers manquants (constaté : calcul/fonts/
      # est apparu au déploiement) mais pas la racine de `remote_path`. Comme
      # ~/wc/ n'existe pas au premier passage, on téléverse depuis la racine du
      # compte, où `wc/` devient un simple sous-dossier à créer.
      - name: Assemble l'arborescence /wc
        working-directory: modul-escal
        run: |
          rm -rf dist/publish
          mkdir -p dist/publish/wc
          cp -R dist/release/staging "dist/publish/wc/staging"
          cp -R "dist/release/$WC_VERSION" "dist/publish/wc/$WC_VERSION"
          find dist/publish -maxdepth 3 -type d

      - name: Deploy /wc via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          port:      22
          local_path: './modul-escal/dist/publish/*'
          remote_path: '.'
          sftp_only: true

      # Étape séparée avec un chemin de fichier explicite : le glob `*` ignore
      # les fichiers commençant par un point. `wc/` existe après l'étape
      # précédente.
      - name: Deploy /wc/.htaccess via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          port:      22
          local_path: './modul-escal/deliverables/hosting/.htaccess'
          remote_path: 'wc'
          sftp_only: true

      # Sans ce contrôle, un échec d'upload est silencieux : le job passe au vert
      # et le 404 n'est découvert qu'en testant à la main.
      - name: Vérifier la publication
        run: |
          base=https://escal.point-soft.fr/wc
          for path in \
            "staging/kre-configurateur.js" \
            "staging/fonts/geist-variable.woff2" \
            "staging/decor/chene-naturel.webp" \
            "$WC_VERSION/kre-configurateur.js"
          do
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$base/$path" || echo 000)
              [ "$code" = "200" ] && break
              sleep 10
            done
            if [ "$code" != "200" ]; then
              echo "::error::$base/$path répond $code"
              exit 1
            fi
            echo "OK $path"
          done

          cors=$(curl -sI --max-time 15 \
            -H 'Origin: https://kitrenovationescalier.knewledge.com' \
            "$base/staging/kre-configurateur.js" \
            | grep -i 'access-control-allow-origin' || true)
          if [ -z "$cors" ]; then
            echo "::warning::Pas d'en-tête CORS sur le bundle : AllowOverride est probablement désactivé, le .htaccess est ignoré. L'intégration WordPress échouera."
          else
            echo "CORS OK : $cors"
          fi

  # ────────────────────────────────────────────────────────────────
  api:
    name: API PHP → /api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy api via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          port:      22
          local_path: './api/*'
          remote_path: 'api'
          sftp_only: true

      # Chemin explicite : le glob `api/*` ci-dessus ignore les fichiers
      # commençant par un point. C'est la raison pour laquelle api/.htaccess,
      # présent dans le repo depuis longtemps, n'avait jamais atteint le serveur
      # — d'où schema.sql téléchargeable et l'en-tête Authorization non transmis.
      - name: Deploy api/.htaccess via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          port:      22
          local_path: './api/.htaccess'
          remote_path: 'api'
          sftp_only: true

  # ────────────────────────────────────────────────────────────────
  home:
    name: Accueil → /
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy landing via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          port:      22
          local_path: './landing/*'
          remote_path: '.'
          sftp_only: true

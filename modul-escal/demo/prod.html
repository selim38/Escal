<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kre-configurateur — bundle de production</title>
    <!--
      Recette du livrable réel : charge le bundle construit (dist/release/) tel
      qu'il sera servi, avec la balise exacte fournie à Knewledge. Vérifie ce que
      le serveur de dev ne peut pas vérifier : minification, absence d'eval,
      résolution des assets via import.meta.url, StrictMode désactivé.
    -->
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      .page { width: min(860px, 100%); margin: 0 auto; padding: 32px 0; }
      .note { font: 13px/1.6 monospace; background: #f7f2ec; color: #5c4a3a; padding: 10px 14px; }
    </style>
  </head>
  <body>
    <div class="page">
      <p class="note">
        Bundle de production, servi depuis <code>/release/v1.0.0/</code>.
        Les assets doivent être résolus relativement au script, pas à la page.
      </p>
      <kre-configurateur lang="fr" theme="kre" demo></kre-configurateur>
    </div>

    <script
      src="/release/v1.0.0/kre-configurateur.js"
      type="module"
      defer
    ></script>
  </body>
</html>
